name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Qt Android (com Qt desktop junto)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          extra: '--autodesktop'

      - name: Instalar NDK 26
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          QT_HOST="$(dirname "$QT_ROOT_DIR")/gcc_64"
          ls "$QT_HOST" > /dev/null
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build --target apk

      - uses: actions/upload-artifact@v4
        with:
          name: ToonBM-apk
          path: build/**/*.apk
