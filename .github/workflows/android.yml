name: Android APK

on:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '26.1.10909125'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Qt (desktop + Android) com aqtinstall
        run: |
          pip install -U aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$HOME/Qt"
          aqt install-qt linux android "$QT_VERSION" android_arm64_v8a --outputdir "$HOME/Qt"
          ls "$HOME/Qt/$QT_VERSION"

      - name: Instalar NDK e plataforma Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          "$HOME/Qt/$QT_VERSION/android_arm64_v8a/bin/qt-cmake" -S . -B build \
            -DQT_HOST_PATH="$HOME/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          cmake --build build --target apk

      - uses: actions/upload-artifact@v4
        with:
          name: ToonBM-apk
          path: build/**/*.apk
